name: Sync Calendars and Expire Payment Holds

# The schedule now runs on cron-job.org (every 5 minutes, on time):
#   /api/cron/guest-mail/, /api/cron/ical/ and /api/cron/expire-pending/
# This workflow stays as a manual backup (Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Send guest e-mails, synchronize calendars and expire old payment holds
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure PRODUCTION_URL and CRON_SECRET in GitHub Secrets."
            exit 1
          fi
          for path in guest-mail ical expire-pending; do
            echo "→ /api/cron/$path/"
            curl --location --fail-with-body --max-time 60 --silent --show-error \
              "${PRODUCTION_URL%/}/api/cron/$path/" \
              -H "Authorization: Bearer $CRON_SECRET"
            echo
          done
