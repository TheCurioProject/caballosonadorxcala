name: Sync Calendars and Expire Payment Holds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize calendars and expire old payment holds
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure PRODUCTION_URL and CRON_SECRET in GitHub Secrets."
            exit 1
          fi
          curl --fail-with-body --max-time 60 --silent --show-error \
            "${PRODUCTION_URL%/}/api/cron/ical/" \
            -H "Authorization: Bearer $CRON_SECRET"
          curl --fail-with-body --max-time 60 --silent --show-error \
            "${PRODUCTION_URL%/}/api/cron/expire-pending/" \
            -H "Authorization: Bearer $CRON_SECRET"
